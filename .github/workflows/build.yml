name: Auto Build MCGyro APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4', cache-disabled: true }
      - name: Accept SDK Licenses
        run: |
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/usr/local/lib/android/sdk"; do
            [ -d "$d" ] && mkdir -p "$d/licenses" && printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$d/licenses/android-sdk-license" && printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$d/licenses/android-sdk-preview-license"
          done
      - name: Setup Project Files
        run: |
          mkdir -p app/src/main/res/xml app/src/main/res/values app/src/main/java/com/example/mcgyro
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
          printf '%s\n' 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' 'rootProject.name = "MCGyroApp"' 'include ":app"' > settings.gradle
          printf '%s\n' 'plugins { id "com.android.application" version "8.2.0" apply false; id "org.jetbrains.kotlin.android" version "1.9.20" apply false }' > build.gradle
          printf '%s\n' 'plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }' 'android { namespace "com.example.mcgyro"; compileSdk 34; defaultConfig { applicationId "com.example.mcgyro"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }' 'dependencies { implementation "androidx.core:core-ktx:1.12.0"; implementation "androidx.appcompat:appcompat:1.6.1" }' > app/build.gradle
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources><string name="app_name">MC 陀螺儀瞄準</string><string name="service_desc">MC 陀螺儀體感瞄準輔助</string></resources>' > app/src/main/res/values/strings.xml
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/res/xml/gyro_service_config.xml
      - name: Generate Dual-Stroke Continuous Build
        run: |
          cat << 'EOF' > app/src/main/java/com/example/mcgyro/MainActivity.kt
          package com.example.mcgyro
          import android.content.*; import android.os.Bundle; import android.provider.Settings; import android.widget.*; import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("gyro_prefs", Context.MODE_PRIVATE)
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(60, 60, 60, 60) }
                  val sensLabel = TextView(this).apply { text = "陀螺儀靈敏度：${prefs.getInt("sens", 55)}"; textSize = 18f }
                  val sensSeek = SeekBar(this).apply { max = 200; progress = prefs.getInt("sens", 55); setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener { override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) { val v = maxOf(10, p); sensLabel.text = "陀螺儀靈敏度：$v"; prefs.edit().putInt("sens", v).apply() }; override fun onStartTrackingTouch(s: SeekBar?) {}; override fun onStopTrackingTouch(s: SeekBar?) {} }) }
                  val invX = Switch(this).apply { text = "反轉左右方向 (X軸)"; isChecked = prefs.getBoolean("invertX", false); setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("invertX", c).apply() } }
                  val invY = Switch(this).apply { text = "反轉上下方向 (Y軸)"; isChecked = prefs.getBoolean("invertY", false); setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("invertY", c).apply() } }
                  val autoMove = Switch(this).apply { text = "轉頭時自動輔助按住前進鍵"; isChecked = prefs.getBoolean("autoMove", false); setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("autoMove", c).apply() } }
                  val enable = Switch(this).apply { text = "啟用陀螺儀背景運作"; isChecked = prefs.getBoolean("enabled", true); setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("enabled", c).apply() } }
                  val btn = Button(this).apply { text = "前往開啟「MC 陀螺儀瞄準」無障礙權限"; setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) } }
                  layout.addView(sensLabel); layout.addView(sensSeek); layout.addView(invX); layout.addView(invY); layout.addView(autoMove); layout.addView(enable); layout.addView(btn); setContentView(layout)
              }
          }
          EOF
          cat << 'EOF' > app/src/main/java/com/example/mcgyro/GyroAccessibilityService.kt
          package com.example.mcgyro
          import android.accessibilityservice.*; import android.content.Context; import android.graphics.*; import android.hardware.*; import android.os.Build; import android.view.*; import android.view.accessibility.AccessibilityEvent; import kotlin.math.abs
          class GyroAccessibilityService : AccessibilityService(), SensorEventListener {
              private lateinit var sensorManager: SensorManager; private var isSwiping = false
              private var curX = 0f; private var curY = 0f; private var aimStroke: GestureDescription.StrokeDescription? = null; private var moveStroke: GestureDescription.StrokeDescription? = null
              private var idleCount = 0; private var touchX = -1f; private var touchY = -1f; private var overlayView: View? = null
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  sensorManager.getDefaultSensor(Sensor.TYPE_GYROSCOPE)?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
                  setupTouchDetector()
              }
              private fun setupTouchDetector() {
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val m = resources.displayMetrics
                  overlayView = object : View(this) {
                      override fun onTouchEvent(e: MotionEvent): Boolean {
                          if (e.actionMasked == MotionEvent.ACTION_DOWN || e.actionMasked == MotionEvent.ACTION_MOVE) { touchX = e.rawX; touchY = e.rawY }
                          else if (e.actionMasked == MotionEvent.ACTION_UP || e.actionMasked == MotionEvent.ACTION_CANCEL) { touchX = -1f; touchY = -1f; moveStroke = null }
                          return false
                      }
                  }
                  val params = WindowManager.LayoutParams((m.widthPixels * 0.35f).toInt(), (m.heightPixels * 0.55f).toInt(), WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH, PixelFormat.TRANSLUCENT).apply { gravity = Gravity.BOTTOM or Gravity.START }
                  try { wm.addView(overlayView, params) } catch (_: Exception) {}
              }
              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null || event.sensor.type != Sensor.TYPE_GYROSCOPE || isSwiping) return
                  val prefs = getSharedPreferences("gyro_prefs", Context.MODE_PRIVATE); if (!prefs.getBoolean("enabled", true)) return
                  val sens = prefs.getInt("sens", 55).toFloat(); val invX = if (prefs.getBoolean("invertX", false)) -1f else 1f; val invY = if (prefs.getBoolean("invertY", false)) -1f else 1f
                  var dx = event.values.getOrElse(0) { 0f } * invX; var dy = event.values.getOrElse(1) { 0f } * invY
                  if (abs(dx) < 0.03f) dx = 0f; if (abs(dy) < 0.03f) dy = 0f
                  if (dx == 0f && dy == 0f) { idleCount++; if (idleCount > 10) { aimStroke = null; moveStroke = null }; return }
                  idleCount = 0; performDualContinuousDrag(dx * sens, dy * sens, prefs.getBoolean("autoMove", false))
              }
              private fun performDualContinuousDrag(dx: Float, dy: Float, autoMove: Boolean) {
                  val m = resources.displayMetrics; val minX = m.widthPixels * 0.55f; val maxX = m.widthPixels * 0.90f; val minY = m.heightPixels * 0.20f; val maxY = m.heightPixels * 0.80f
                  if (aimStroke == null || curX + dx !in minX..maxX || curY + dy !in minY..maxY) { curX = m.widthPixels * 0.72f; curY = m.heightPixels * 0.50f; aimStroke = null; moveStroke = null }
                  val nextX = curX + dx; val nextY = curY + dy; val aimPath = Path().apply { moveTo(curX, curY); lineTo(nextX, nextY) }
                  val newAim = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      if (aimStroke == null) GestureDescription.StrokeDescription(aimPath, 0, 32, true) else aimStroke!!.continueStroke(aimPath, 0, 32, true)
                  } else { GestureDescription.StrokeDescription(aimPath, 0, 45) }
                  curX = nextX; curY = nextY; aimStroke = newAim; isSwiping = true
                  val builder = GestureDescription.Builder().addStroke(newAim)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && (autoMove || touchX > 0f)) {
                      val mx = if (touchX > 0f) touchX else m.widthPixels * 0.16f
                      val my = if (touchY > 0f) touchY else m.heightPixels * 0.62f
                      val movePath = Path().apply { moveTo(mx, my); lineTo(mx + 1f, my) }
                      val newMove = if (moveStroke == null) GestureDescription.StrokeDescription(movePath, 0, 32, true) else moveStroke!!.continueStroke(movePath, 0, 32, true)
                      moveStroke = newMove; builder.addStroke(newMove)
                  } else { moveStroke = null }
                  dispatchGesture(builder.build(), object : GestureResultCallback() { override fun onCompleted(g: GestureDescription?) { isSwiping = false }; override fun onCancelled(g: GestureDescription?) { isSwiping = false; aimStroke = null; moveStroke = null } }, null)
              }
              override fun onAccuracyChanged(s: Sensor?, a: Int) {}; override fun onAccessibilityEvent(e: AccessibilityEvent?) {}; override fun onInterrupt() { aimStroke = null; moveStroke = null }
              override fun onDestroy() { super.onDestroy(); sensorManager.unregisterListener(this); overlayView?.let { try { (getSystemService(Context.WINDOW_SERVICE) as WindowManager).removeView(it) } catch (_: Exception) {} } }
          }
          EOF
          gradle assembleDebug --no-daemon --warning-mode none
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: MCGyro-App-APK, path: app/build/outputs/apk/debug/*.apk }
